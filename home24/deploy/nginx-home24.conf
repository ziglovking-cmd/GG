# Old IP 89.111.184.212 — HTTPS guest site
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://89-111-184-212.sslip.io$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 89-111-184-212.sslip.io 89.111.184.212 _;

    ssl_certificate /etc/letsencrypt/live/89-111-184-212.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89-111-184-212.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512m;

    location /shared/ {
        alias /opt/home24/shared/;
        gzip off;
        types { video/mp4 mp4 m4v; video/quicktime mov; }
        default_type video/mp4;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Next build assets from disk (do not proxy large JS/CSS through Node)
    location /_next/static/ {
        alias /opt/home24/app/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/media {
        proxy_pass http://127.0.0.1:43147;
        proxy_http_version 1.1;
        proxy_set_header Host 89-111-184-212.sslip.io;
        proxy_set_header Range $http_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /api/drop/ {
        proxy_pass http://127.0.0.1:43147;
        proxy_http_version 1.1;
        proxy_set_header Host 89-111-184-212.sslip.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 512m;
        client_body_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:43147;
        proxy_http_version 1.1;
        proxy_set_header Host 89-111-184-212.sslip.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host 89-111-184-212.sslip.io;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
    }
}
