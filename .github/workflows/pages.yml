name: Deploy love letter to GitHub Pages

on:
  push:
    branches: [main, cursor/love-site-9bdf]
    paths:
      - 'love-letter/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: love-letter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: love-letter/package-lock.json
      - run: npm ci
      - run: npm run build -- --base=/GG/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: love-letter/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
