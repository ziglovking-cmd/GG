services:
  tg-audience:
    build:
      context: .
    container_name: tg-audience
    restart: unless-stopped
    ports:
      - "127.0.0.1:8777:8777"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  campaign-reporter:
    build:
      context: .
    container_name: tg-audience-reporter
    restart: unless-stopped
    command: ["python", "-m", "app.reporter"]
    volumes:
      - ./data:/app/data
    environment:
      TG_AUDIENCE_URL: http://tg-audience:8777
      REPORTER_POLL_SECONDS: "30"
      REPORTER_SETTLE_SECONDS: "600"
      REPORTER_BOT_COMMANDS: "0"
      REPORTER_TARGET_CHAT: "@skyptop_new_delivery"
      REPORTER_TARGET_CHAT_ID: "4396252688"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://tg-audience:8777/api/settings', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
